name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar projeto
        run: |
          mkdir proj
          for f in *; do
            [ -f "$f" ] || continue
            case "$f" in README*) continue;; esac
            if [ "$(head -c2 "$f")" = "PK" ]; then cp "$f" /tmp/t.zip
            else base64 -d "$f" > /tmp/t.zip 2>/dev/null || continue; fi
            unzip -q -o /tmp/t.zip -d proj 2>/dev/null || continue
          done
          s=$(find proj -name settings.gradle.kts | head -1)
          if [ -z "$s" ]; then echo "ERRO: projeto nao encontrado"; exit 1; fi
          echo "PROJ=$(dirname "$s")" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Compilar
        run: |
          cd "$PROJ"
          gradle assembleDebug --no-daemon > build.log 2>&1 || { grep -E "^e: |error:" build.log | head -30; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: G35-apk
          path: proj/**/app-debug.apk
