name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar projeto
        run: |
          ls -la
          base64 -d "g35 (1).txt" > /tmp/t.zip
          mkdir proj
          unzip -q /tmp/t.zip -d proj
          s=$(find proj -name settings.gradle.kts | head -1)
          echo "PROJ=$(dirname "$s")" >> $GITHUB_ENV
          grep -E "versionName|shizuku" "$(dirname "$s")/app/build.gradle.kts"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Compilar
        run: |
          cd "$PROJ"
          gradle assembleDebug --no-daemon > build.log 2>&1 || { grep -E "^e: " build.log | head -30; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: G35-apk
          path: proj/**/app-debug.apk
